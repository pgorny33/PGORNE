<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>P.GÓRNE — Thank You</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/png" href="/assets/accent-pantone.png" />
  <style>
    :root{--paper:#f3efe8;--ink:#141414;--accent:#6B3529;}
    html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:Arial, Helvetica, sans-serif;}
    main{min-height:100vh;display:grid;place-items:center;text-align:center;padding:40px;}
    h1{font-family:Georgia,"Times New Roman",serif;font-size:38px;font-weight:400;line-height:1.1;letter-spacing:.02em;margin:0 0 24px;}
    p{max-width:560px;font-family:Georgia,"Times New Roman",serif;font-size:18px;line-height:1.9;margin:0 auto 36px;}
    a{color:var(--ink);text-decoration:none;text-transform:uppercase;letter-spacing:.16em;font-size:12px;}
    a:hover{color:var(--accent);}
  </style>
</head>
<body>
  <main>
    <div>
      <h1>Thank You</h1>
      <p>Your appointment request has been received. We will be in touch shortly to arrange your consultation.</p>
      <a href="/">Return</a>
    </div>
  </main>
</body>
</html>
