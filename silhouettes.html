<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>P.GÓRNE — Silhouettes</title>
  <meta name="description" content="P.GÓRNE house silhouettes and the cloths they can be made in." />
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/png" href="/assets/accent-pantone.png" />
  <style>
    :root{--paper:#f3efe8;--ink:#141414;--accent:#6B3529;--leaf:#f8f5ef;--line:rgba(20,20,20,.18);--pad:clamp(18px,4vw,64px);--header-height:50px}
    *{box-sizing:border-box}
    html,body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,Helvetica,sans-serif;-webkit-font-smoothing:antialiased}
    a{color:inherit;text-decoration:none}
    button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
    .label,.return{font-size:10px;letter-spacing:.18em;text-transform:uppercase}
    .site-header{position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:24px var(--pad) 10px;background:var(--paper)}
    .wordmark{font-size:14px;letter-spacing:.16em;font-weight:500}
    .return:hover{color:var(--accent)}
    .studio{display:grid;grid-template-columns:minmax(0,1fr) 440px;gap:clamp(30px,5vw,80px);align-items:start;min-height:calc(100svh - var(--header-height));padding:10px var(--pad) 40px}
    .preview{position:sticky;top:calc(var(--header-height) + 12px);z-index:5;display:flex;flex-direction:column;height:calc(100svh - var(--header-height) - 22px);min-height:580px;max-height:850px;background:var(--paper)}
    .drawing{flex:1;min-height:0;margin:0;display:grid;place-items:center}
    .drawing svg{width:100%;height:100%;max-height:calc(100svh - 220px);overflow:visible}
    .preview-controls{flex:none;padding:0 0 6px;background:var(--paper)}
    .garment{isolation:isolate}
    .garment[hidden]{display:none}
    .dye{fill:var(--dye,var(--leaf))}
    .weave{fill:url(#cloth);mix-blend-mode:normal;opacity:1}
    .art{fill:none;stroke:var(--ink);stroke-width:1.2;stroke-linejoin:round;stroke-linecap:round;vector-effect:non-scaling-stroke}
    .art .soft{stroke-opacity:.4}
    .art .shirt{fill:#fbf9f4}
    .art .btn{fill:var(--leaf)}
    .preview-controls h1{margin:0 0 18px;font-weight:400}
    .tabs{display:flex;gap:26px;margin-bottom:18px}
    .tabs button{-webkit-tap-highlight-color:transparent;padding-bottom:4px;border-bottom:1px solid transparent;color:rgba(20,20,20,.5)}
    .tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--ink)}
    .readout{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--line);padding:16px 0 18px;min-height:52px}
    .readout .name{font-size:13px;letter-spacing:.16em;text-transform:uppercase}
    .readout .no{color:rgba(20,20,20,.5)}
    .swatches{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px 10px}
    .family-heading{grid-column:1/-1;margin:18px 0 2px;font-size:10px;font-weight:400;letter-spacing:.18em;text-transform:uppercase}
    .swatches button{position:relative;display:block;padding-bottom:9px;-webkit-tap-highlight-color:transparent}
    .swatches span{display:block;aspect-ratio:1;background:var(--hex);clip-path:polygon(0.00% 4.50%,6.25% 0.00%,12.50% 4.50%,18.75% 0.00%,25.00% 4.50%,31.25% 0.00%,37.50% 4.50%,43.75% 0.00%,50.00% 4.50%,56.25% 0.00%,62.50% 4.50%,68.75% 0.00%,75.00% 4.50%,81.25% 0.00%,87.50% 4.50%,93.75% 0.00%,100.00% 4.50%,95.50% 0.00%,100.00% 6.25%,95.50% 12.50%,100.00% 18.75%,95.50% 25.00%,100.00% 31.25%,95.50% 37.50%,100.00% 43.75%,95.50% 50.00%,100.00% 56.25%,95.50% 62.50%,100.00% 68.75%,95.50% 75.00%,100.00% 81.25%,95.50% 87.50%,100.00% 93.75%,95.50% 100.00%,100.00% 95.50%,93.75% 100.00%,87.50% 95.50%,81.25% 100.00%,75.00% 95.50%,68.75% 100.00%,62.50% 95.50%,56.25% 100.00%,50.00% 95.50%,43.75% 100.00%,37.50% 95.50%,31.25% 100.00%,25.00% 95.50%,18.75% 100.00%,12.50% 95.50%,6.25% 100.00%,0.00% 95.50%,4.50% 100.00%,0.00% 93.75%,4.50% 87.50%,0.00% 81.25%,4.50% 75.00%,0.00% 68.75%,4.50% 62.50%,0.00% 56.25%,4.50% 50.00%,0.00% 43.75%,4.50% 37.50%,0.00% 31.25%,4.50% 25.00%,0.00% 18.75%,4.50% 12.50%,0.00% 6.25%,4.50% 0.00%);transition:transform 250ms ease}
    .swatches button:hover span,.swatches button:focus-visible span{transform:scale(1.08)}
    .swatches button::after{content:"";position:absolute;left:50%;bottom:0;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--ink);opacity:0;transition:opacity 200ms}
    .swatches button[aria-pressed="true"]::after{opacity:1}
    .swatches button:focus-visible{outline:1px solid var(--ink);outline-offset:3px}
    .swatches button .sample{background:var(--swatch-image) center/cover no-repeat,var(--hex);background-blend-mode:normal}
    .swatches button .swatch-name{aspect-ratio:auto;background:none;background-blend-mode:normal;clip-path:none;font-size:9px;letter-spacing:.1em;line-height:1.25;min-height:2.5em;padding-top:7px;text-align:center;text-transform:uppercase;overflow-wrap:anywhere;transition:none}
    .swatches button:hover .swatch-name,.swatches button:focus-visible .swatch-name{transform:none}
    .book{display:flex;justify-content:space-between;margin-top:0;padding:18px 20px;background:var(--ink);color:var(--paper);font-size:11px;letter-spacing:.2em;text-transform:uppercase;transition:background 200ms}
    .book:hover{background:var(--accent)}
    .note{margin:18px 0 0;color:rgba(20,20,20,.45);text-align:center;line-height:1.8}
    @media (max-width:900px){
      .studio{grid-template-columns:minmax(0,1fr);gap:10px;min-height:0;padding:0 var(--pad) 40px}
      .preview{top:var(--header-height);height:54svh;min-height:340px;max-height:520px}
      .drawing svg{height:100%;max-height:42svh}
      .preview-controls h1{display:none}
      .tabs{justify-content:center;margin-bottom:8px}
      .readout{padding:8px 0;min-height:38px}
      .preview-controls .book{margin-top:4px;padding:12px 16px}
      .panel{padding-top:8px}
      .swatches{gap:9px 8px}
    }
    @media (max-width:700px){.swatches{grid-template-columns:repeat(4,minmax(0,1fr))}}
    @media (prefers-reduced-motion:reduce){.dye,.weave,.swatches span{transition:none}}
  </style>
</head>

  <script src="/assets/menu.js" defer></script>
  <script>
    (function () {
      const svg = document.getElementById('sketch');
      const garments = svg.querySelectorAll('.garment');
      const tabs = document.querySelectorAll('.tabs button');
      const grid = document.querySelector('.swatches');
      const swatches = grid.querySelectorAll('button');
      const patternImage = svg.querySelector('#cloth image');
      const nameEl = document.querySelector('.readout .name');
      const noEl = document.querySelector('.readout .no');
      const bookText = document.querySelector('.book-text');
      const tileLoads = new Map();
      let selected = null;
      let visible = null;

      function preloadTile(src) {
        if (tileLoads.has(src)) return tileLoads.get(src);
        let finish;
        const loaded = new Promise((resolve) => { finish = resolve; });
        const image = new Image();
        image.onload = () => finish(true);
        image.onerror = () => finish(false);
        tileLoads.set(src, loaded);
        image.src = src;
        if (image.complete) finish(image.naturalWidth > 0);
        return loaded;
      }

      function show(btn) {
        visible = btn;
        if (btn) {
          svg.style.setProperty('--dye', btn.dataset.hex);
          svg.classList.add('dyed');
          nameEl.textContent = btn.dataset.name;
          noEl.textContent = 'No. ' + btn.dataset.no;
          if (patternImage.getAttribute('href') !== btn.dataset.tile) patternImage.removeAttribute('href');
          preloadTile(btn.dataset.tile).then((loaded) => {
            if (loaded && visible === btn) patternImage.setAttribute('href', btn.dataset.tile);
          });
        } else {
          svg.style.removeProperty('--dye');
          svg.classList.remove('dyed');
          patternImage.removeAttribute('href');
          nameEl.textContent = 'Choose a colour';
          noEl.textContent = '';
        }
      }
      function select(btn) {
        selected = btn;
        swatches.forEach((b) => b.setAttribute('aria-pressed', String(b === btn)));
        bookText.textContent = 'Book a fitting in ' + btn.dataset.name;
        show(btn);
      }
      swatches.forEach((btn) => {
        btn.addEventListener('pointerenter', (e) => {
          preloadTile(btn.dataset.tile);
          if (e.pointerType === 'mouse') show(btn);
        });
        btn.addEventListener('focus', () => {
          preloadTile(btn.dataset.tile);
          show(btn);
        });
        btn.addEventListener('click', () => select(btn));
      });
      grid.addEventListener('pointerleave', (e) => { if (e.pointerType === 'mouse') show(selected); });
      grid.addEventListener('focusout', (e) => { if (!grid.contains(e.relatedTarget)) show(selected); });
      tabs.forEach((tab) => tab.addEventListener('click', () => {
        tabs.forEach((t) => t.setAttribute('aria-selected', String(t === tab)));
        const name = tab.textContent.trim();
        garments.forEach((g) => g.toggleAttribute('hidden', g.dataset.garment !== name));
        svg.setAttribute('aria-label', name + ' sketch');
      }));
    }());
  </script>
