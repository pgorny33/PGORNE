<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>P.GÓRNE</title>
  <meta name="description" content="P.GÓRNE — New York atelier." />
  <link rel="icon" type="image/png" href="/assets/accent-pantone.png" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="P.GÓRNE" />
  <meta property="og:title" content="P.GÓRNE" />
  <meta property="og:description" content="P.GÓRNE — New York atelier." />
  <meta property="og:url" content="https://www.pgorne.com/" />
  <meta property="og:image" content="https://www.pgorne.com/assets/poster.jpg" />
  <meta property="og:image:width" content="1616" />
  <meta property="og:image:height" content="1080" />
  <meta name="twitter:card" content="summary_large_image" />
  <style>
    :root{
      --paper:#f3efe8;
      --ink:#141414;
      --accent:#6B3529;
      --video-ratio:1.4962962963; /* 1616 / 1080 */
    }
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;background:var(--paper);color:var(--ink);}
    body{overflow:hidden;font-family:Arial, Helvetica, sans-serif;}
    .stage{position:fixed;inset:0;background:var(--paper);overflow:hidden;}

    /* The video and accent share the exact same cover-sized frame so the accent aligns with the final video frame. */
    .video-frame{
      position:absolute;
      left:50%;
      top:50%;
      width:max(100vw, calc(100vh * var(--video-ratio)));
      height:max(100vh, calc(100vw / var(--video-ratio)));
      transform:translate(-50%,-50%);
    }
    video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;background:var(--paper);}

    .accent{
      position:absolute;
      left:46.41%;   /* 750 / 1616 */
      top:29.63%;    /* 320 / 1080 */
      width:2.85%;   /* 46 / 1616 */
      height:5.46%;  /* 59 / 1080 */
      opacity:0;
      pointer-events:none;
      transform:translateY(0);
      transition:opacity 260ms ease;
      animation:accentLift 7s ease-in-out infinite;
      animation-delay:1.2s;
    }
    body.ready .accent{opacity:1;}
    @keyframes accentLift{
      0%,86%,100%{transform:translateY(0)}
      92%{transform:translateY(-4px)}
    }
    .accent-button{
      position:absolute;
      left:45.95%;
      top:28.75%;
      width:4.0%;
      height:7.0%;
      border:0;
      background:transparent;
      padding:0;
      cursor:pointer;
      opacity:0;
      pointer-events:none;
    }
    body.ready .accent-button{opacity:1;pointer-events:auto;}
    .accent-button:focus-visible{outline:1px solid var(--accent);outline-offset:10px;}

    .stage{cursor:pointer;}
    .ripple{
      position:absolute;
      left:47.83%;
      top:32.36%;
      width:5.2%;
      aspect-ratio:1;
      border:1px solid var(--accent);
      border-radius:50%;
      transform:translate(-50%,-50%) scale(.3);
      opacity:0;
      pointer-events:none;
    }
    body.ready .ripple{animation:ripple 4.2s cubic-bezier(.2,.6,.3,1) 1.6s infinite;}
    body.ready .ripple.second{animation-delay:2.1s;}
    @keyframes ripple{
      0%{transform:translate(-50%,-50%) scale(.3);opacity:0}
      12%{opacity:.55}
      60%,100%{transform:translate(-50%,-50%) scale(2.2);opacity:0}
    }
    .accent{transition:opacity 260ms ease, filter 300ms ease;}
    body.ready .stage:hover .accent{filter:brightness(1.15);}

    .enter-word{
      position:absolute;
      left:50.3%;
      top:76%;
      transform:translateX(-50%);
      appearance:none;border:0;background:transparent;padding:8px 4px;
      font:inherit;font-size:11px;letter-spacing:.42em;text-indent:.42em;text-transform:uppercase;
      color:var(--accent);cursor:pointer;
      opacity:0;pointer-events:none;transition:opacity 1.2s ease;
    }
    .enter-word::after{
      content:"";display:block;height:1px;margin:7px auto 0;width:0;background:var(--accent);
      transition:width 1.4s ease .4s;
    }
    body.hint-b.show-word .enter-word{opacity:1;pointer-events:auto;}
    body.hint-b.show-word .enter-word::after{width:100%;}
    body.hint-b .ripple.second{display:none;}

    .cursor-label{
      position:fixed;left:0;top:0;pointer-events:none;
      display:flex;align-items:center;gap:10px;
      font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:var(--accent);
      opacity:0;transition:opacity 300ms ease;
    }
    .cursor-label::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent);}
    @media (hover:hover) and (pointer:fine){
      body.hint-c.ready .stage{cursor:none;}
      body.hint-c.ready.pointer-in .cursor-label{opacity:1;}
      body.hint-c .ripple{display:none;}
    }
    body.menu-open .ripple, body.menu-open .enter-word, body.menu-open .cursor-label{opacity:0 !important;animation:none !important;}

    .menu{position:fixed;inset:0;background:rgba(243,239,232,.985);display:grid;place-items:center;opacity:0;pointer-events:none;transition:opacity 650ms ease;}
    .menu.open{opacity:1;pointer-events:auto;}
    nav{display:flex;flex-direction:column;gap:clamp(18px,3vh,30px);text-align:center;}
    nav a{text-decoration:none;color:var(--ink);font-size:clamp(24px,5vw,64px);letter-spacing:.08em;text-transform:uppercase;font-weight:300;}
    nav a:hover{color:var(--accent);}
    .close{position:fixed;top:28px;right:32px;appearance:none;border:0;background:transparent;letter-spacing:.18em;color:var(--ink);cursor:pointer;font-size:12px;text-transform:uppercase;}


    /* Mobile: preserve the full logo animation instead of cropping it.
       The surrounding page background uses the same luxury ivory, so the extra vertical space feels intentional. */
    @media (max-width: 799px) and (orientation: portrait){
      .video-frame{
        width:100vw;
        height:calc(100vw / var(--video-ratio));
      }
      .accent{
        animation:accentLiftMobile 7s ease-in-out infinite;
        animation-delay:1.2s;
      }
      @keyframes accentLiftMobile{
        0%,86%,100%{transform:translateY(0)}
        92%{transform:translateY(-3px)}
      }
    }
  </style>
</head>
<body>
  <main class="stage" aria-label="P.GÓRNE opening animation">
    <div class="video-frame">
      <video id="introVideo" autoplay muted playsinline poster="assets/poster.jpg">
        <source src="assets/pgorne-logo-animation-1080.mp4" type="video/mp4" media="(min-width: 800px)">
        <source src="assets/pgorne-logo-animation-720.mp4" type="video/mp4">
      </video>
      <span class="ripple" aria-hidden="true"></span>
      <span class="ripple second" aria-hidden="true"></span>
      <img class="accent" src="assets/accent-pantone.png" alt="" aria-hidden="true" />
      <button class="accent-button" id="enterButton" aria-label="Enter P.GÓRNE" aria-controls="menu" aria-expanded="false"></button>
      <button class="enter-word" type="button" tabindex="-1" aria-hidden="true">Enter</button>
    </div>
    <div class="cursor-label" aria-hidden="true">Enter</div>
  </main>

  <section class="menu" id="menu" aria-label="Site navigation" inert>
    <button class="close" id="closeButton">Close</button>
    <nav>
      <a href="/ethos">Ethos</a>
      <a href="/atelier">Atelier</a>
      <a href="/galerie">Galerie</a>
      <a href="/ready-made">Ready Made</a>
      <a href="/book">Book</a>
    </nav>
  </section>

  <script>
    const video = document.getElementById('introVideo');
    const menu = document.getElementById('menu');
    const enter = document.getElementById('enterButton');
    const closeButton = document.getElementById('closeButton');
    const reveal = () => document.body.classList.add('ready');

    // Make the entry accent visible and clickable almost immediately while preserving the original logo/video cadence.
    window.setTimeout(reveal, 1000);
    video.addEventListener('error', reveal);

    function open() {
      menu.classList.add('open');
      document.body.classList.add('menu-open');
      menu.inert = false;
      enter.setAttribute('aria-expanded', 'true');
      menu.querySelector('nav a').focus();
    }

    function close() {
      if (!menu.classList.contains('open')) return;
      menu.classList.remove('open');
      document.body.classList.remove('menu-open');
      menu.inert = true;
      enter.setAttribute('aria-expanded', 'false');
      enter.focus();
    }

    const variant = new URLSearchParams(location.search).get('v') || 'a';
    document.body.classList.add('hint-' + variant);
    window.setTimeout(() => { if (!menu.classList.contains('open')) document.body.classList.add('show-word'); }, 3500);

    const stage = document.querySelector('.stage');
    const cursorLabel = document.querySelector('.cursor-label');
    stage.addEventListener('click', event => {
      if (!document.body.classList.contains('ready') || event.target === enter) return;
      open();
    });
    stage.addEventListener('pointermove', event => {
      document.body.classList.add('pointer-in');
      cursorLabel.style.transform = `translate(${event.clientX - 3}px, ${event.clientY - 6}px)`;
    });
    stage.addEventListener('pointerleave', () => document.body.classList.remove('pointer-in'));

    enter.addEventListener('click', open);
    closeButton.addEventListener('click', close);
    document.addEventListener('keydown', event => { if (event.key === 'Escape') close(); });
  </script>
</body>
</html>
