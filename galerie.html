  <style>
    :root{
      --paper:#f3efe8;
      --ink:#141414;
      --accent:#6B3529;
      --leaf:#f8f5ef;
      --page-pad:clamp(22px,4vw,64px);
      --page-h:min(calc(100svh - 190px), calc((100vw - 2 * var(--page-pad)) * .6667));
      --page-w:calc(var(--page-h) * .75);
    }
    *{box-sizing:border-box}
    html,body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,Helvetica,sans-serif;-webkit-font-smoothing:antialiased}
    body{min-height:100svh;display:flex;flex-direction:column;overflow-x:hidden}
    a{color:inherit;text-decoration:none}
    button{font:inherit;color:inherit}

    .site-header{
      position:relative;z-index:30;display:flex;justify-content:space-between;align-items:center;
      padding:26px var(--page-pad) 0;
    }
    .wordmark{font-size:14px;letter-spacing:.16em;font-weight:500}
    .return{font-size:10px;letter-spacing:.18em;text-transform:uppercase}
    .return:hover{color:var(--accent)}
    .visually-hidden{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

    main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:24px var(--page-pad) 26px}

    .book{position:relative;width:calc(var(--page-w) * 2);height:var(--page-h);perspective:2600px;transition:transform 1000ms cubic-bezier(.45,.05,.25,1);user-select:none;-webkit-user-select:none;touch-action:pan-y}
    .book.closed-start{transform:translateX(-25%)}
    .book.closed-end{transform:translateX(25%)}
    .leaf{position:absolute;top:0;left:50%;width:50%;height:100%;transform-origin:left center;transform-style:preserve-3d;transition:transform 1000ms cubic-bezier(.45,.05,.25,1)}
    .leaf.flipped{transform:rotateY(-180deg)}
    .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--leaf);overflow:hidden}
    .leaf.top .face:not(.empty),.leaf.turning .face:not(.empty){box-shadow:0 1px 2px rgba(20,20,20,.06),0 18px 40px -24px rgba(20,20,20,.22)}
    .face.back{transform:rotateY(180deg)}
    .face.empty{background:transparent;box-shadow:none}
    .face::after{content:"";position:absolute;inset:0;pointer-events:none}
    .face.front::after{background:linear-gradient(to right,rgba(20,20,20,.13),rgba(20,20,20,.03) 6%,transparent 16%)}
    .face.back::after{background:linear-gradient(to left,rgba(20,20,20,.13),rgba(20,20,20,.03) 6%,transparent 16%)}
    .face.empty::after{display:none}
    .leaf.turning .face:not(.empty)::after{animation:turnShade 1000ms ease-in-out}
    @keyframes turnShade{50%{background-color:rgba(20,20,20,.07)}}

    .photo{margin:0;position:absolute;inset:7% 8%;display:grid;place-items:center;cursor:zoom-in}
    .photo img{display:block;max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;opacity:0;transition:opacity 500ms ease}
    .photo img.loaded{opacity:1}
    .photo:focus-visible{outline:1px solid var(--accent);outline-offset:6px}

    .colophon{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:10%}
    .colophon p{margin:0;font-size:10px;letter-spacing:.22em;text-transform:uppercase}
    .cover{position:absolute;inset:0}
    .cover img{display:block;width:100%;height:100%;object-fit:cover}

    .turn-zone{position:absolute;top:0;z-index:200;height:100%;width:9%;border:0;padding:0;background:transparent;cursor:pointer}
    .turn-zone.prev{left:0;cursor:w-resize}
    .turn-zone.next{right:0;cursor:e-resize}
    .turn-zone.next:hover:not(:disabled){background:linear-gradient(to left,rgba(20,20,20,.07),transparent)}
    .turn-zone.prev:hover:not(:disabled){background:linear-gradient(to right,rgba(20,20,20,.07),transparent)}
    .turn-zone:disabled{cursor:default}
    .turn-zone:focus{outline:none}

    .controls{display:flex;align-items:center;gap:clamp(28px,5vw,64px);font-size:10px;letter-spacing:.18em;text-transform:uppercase}
    .controls button{appearance:none;border:0;background:transparent;padding:8px 2px;cursor:pointer;letter-spacing:inherit;text-transform:inherit;font-size:inherit}
    .controls button:hover:not(:disabled){color:var(--accent)}
    .controls button:disabled{opacity:.3;cursor:default}
    .controls button:focus-visible{outline:1px solid var(--accent);outline-offset:4px}
    .counter{min-width:9em;text-align:center;font-variant-numeric:tabular-nums}

    .lightbox{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:clamp(16px,4vw,56px);background:rgba(243,239,232,.99);opacity:0;pointer-events:none;transition:opacity 220ms ease}
    .lightbox.open{opacity:1;pointer-events:auto}
    .lightbox img{width:auto;height:auto;max-width:92vw;max-height:88vh;object-fit:contain}
    .lightbox-close{position:absolute;top:24px;right:var(--page-pad);border:0;background:transparent;color:var(--ink);font:inherit;font-size:10px;letter-spacing:.18em;text-transform:uppercase;cursor:pointer}
    .lightbox-close:hover{color:var(--accent)}

    .noscript-list{display:grid;gap:40px;max-width:900px;margin:0 auto}
    .noscript-list img{width:100%;height:auto}

    @media (max-width:760px){
      :root{
        --page-pad:22px;
        --page-h:min(calc(100svh - 170px), calc((100vw - 2 * var(--page-pad)) * 1.3333));
      }
      .site-header{padding-top:20px}
      main{gap:20px;padding-top:18px}
      .book{width:var(--page-w)}
      .book.closed-start,.book.closed-end{transform:none}
      .leaf{left:0;width:100%}
      .face.front::after{background:linear-gradient(to right,rgba(20,20,20,.08),transparent 8%)}
      .turn-zone{width:16%}
      .photo{inset:6% 7%}
    }

    @media (prefers-reduced-motion:reduce){
      .book,.leaf,.lightbox,.photo img{transition:none}
      .leaf.turning .face:not(.empty)::after{animation:none}
    }
  </style>
  <noscript><style>.book,.controls{display:none}</style></noscript>

  <script>
    const book = document.getElementById('book');
    const zonePrev = document.getElementById('zonePrev');
    const zoneNext = document.getElementById('zoneNext');
    const prevButton = document.getElementById('prevButton');
    const nextButton = document.getElementById('nextButton');
    const counter = document.getElementById('counter');
    const lightbox = document.getElementById('lightbox');
    const lightboxImage = document.getElementById('lightboxImage');
    const lightboxClose = document.getElementById('lightboxClose');
    const pages = Array.from(document.getElementById('galeriePages').content.children);
    const photoCount = pages.filter((page) => page.classList.contains('photo')).length;
    const single = window.matchMedia('(max-width: 760px)');
    const TURN_MS = 1000;

    let perLeaf = 2;
    let leaves = [];
    let spread = 0;
    let previousFocus = null;

    function pageContent(index) {
      const face = document.createElement('div');
      const page = pages[index];
      if (!page) { face.className = 'face empty'; return face; }
      face.className = 'face';
      const node = page.cloneNode(true);
      node.dataset.page = index;
      face.appendChild(node);
      const image = node.classList.contains('photo') ? node.querySelector('img') : null;
      if (image) {
        node.tabIndex = -1;
        node.setAttribute('role', 'button');
        node.setAttribute('aria-label', `Expand photograph ${index} of ${photoCount}`);
        image.addEventListener('load', () => image.classList.add('loaded'));
        node.addEventListener('click', () => openLightbox(image));
        node.addEventListener('keydown', (event) => {
          if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); openLightbox(image); }
        });
      }
      return face;
    }

    function build(keepPage) {
      leaves.forEach((leaf) => leaf.remove());
      perLeaf = single.matches ? 1 : 2;
      leaves = [];
      const count = Math.ceil(pages.length / perLeaf);
      for (let i = 0; i < count; i++) {
        const leaf = document.createElement('div');
        leaf.className = 'leaf';
        const front = pageContent(i * perLeaf);
        front.classList.add('front');
        leaf.appendChild(front);
        if (perLeaf === 2) {
          const back = pageContent(i * perLeaf + 1);
          back.classList.add('back');
          leaf.appendChild(back);
        }
        book.insertBefore(leaf, zonePrev);
        leaves.push(leaf);
      }
      spread = Math.min(perLeaf === 2 ? Math.ceil(keepPage / 2) : keepPage, maxSpread());
      render(false);
    }

    function maxSpread() {
      return perLeaf === 2 && pages.length % 2 === 0 ? leaves.length : leaves.length - 1;
    }

    function visiblePages() {
      return perLeaf === 2 ? [spread * 2 - 1, spread * 2] : [spread];
    }

    function firstVisiblePage() {
      const visible = visiblePages().filter((index) => index >= 0 && index < pages.length);
      return visible.length ? visible[0] : 0;
    }

    function loadAround() {
      const [first] = visiblePages();
      const span = perLeaf === 2 ? 6 : 3;
      for (let index = Math.max(0, first - span); index <= first + span + 1; index++) {
        book.querySelectorAll(`[data-page="${index}"] img[data-src]`).forEach((image) => {
          image.src = image.dataset.src;
          image.removeAttribute('data-src');
        });
      }
    }

    function stack() {
      leaves.forEach((leaf, i) => {
        if (leaf.classList.contains('turning')) return;
        leaf.style.zIndex = i < spread ? i + 1 : leaves.length - i;
      });
    }

    function render(animate, turned) {
      leaves.forEach((leaf, i) => {
        leaf.classList.toggle('flipped', i < spread);
        leaf.classList.toggle('top', i === spread - 1 || i === spread);
      });
      book.classList.toggle('closed-start', perLeaf === 2 && spread === 0);
      book.classList.toggle('closed-end', perLeaf === 2 && spread === leaves.length);
      if (animate && turned) {
        turned.classList.add('turning');
        turned.style.zIndex = leaves.length + (++turnSeq);
        window.clearTimeout(turned.turnTimer);
        turned.turnTimer = window.setTimeout(() => { turned.classList.remove('turning'); stack(); }, TURN_MS);
      }
      stack();
      const visible = visiblePages();
      book.querySelectorAll('[data-page]').forEach((node) => {
        const on = visible.includes(Number(node.dataset.page));
        node.closest('.face').inert = !on;
        if (node.getAttribute('role') === 'button') node.tabIndex = on ? 0 : -1;
      });
      prevButton.disabled = zonePrev.disabled = spread === 0;
      nextButton.disabled = zoneNext.disabled = spread === maxSpread();
      const photos = visible.filter((index) => index >= 1 && index <= photoCount);
      counter.textContent = photos.length
        ? `${photos.join(' — ')} / ${photoCount}`
        : (spread === 0 ? 'Galerie' : 'Fin');
      loadAround();
    }

    let turnSeq = 0;

    function turn(direction) {
      const target = spread + direction;
      if (target < 0 || target > maxSpread()) return;
      const turned = direction > 0 ? leaves[spread] : leaves[spread - 1];
      spread = target;
      render(true, turned);
    }

    zoneNext.addEventListener('click', () => turn(1));
    zonePrev.addEventListener('click', () => turn(-1));
    nextButton.addEventListener('click', () => turn(1));
    prevButton.addEventListener('click', () => turn(-1));

    document.addEventListener('keydown', (event) => {
      if (event.defaultPrevented || lightbox.classList.contains('open')) return;
      if (document.querySelector('.site-menu.open')) return;
      if (event.key === 'ArrowRight') { event.preventDefault(); turn(1); }
      if (event.key === 'ArrowLeft') { event.preventDefault(); turn(-1); }
    });

    let touchX = null;
    let touchY = null;
    book.addEventListener('touchstart', (event) => {
      touchX = event.touches[0].clientX;
      touchY = event.touches[0].clientY;
    }, { passive: true });
    book.addEventListener('touchend', (event) => {
      if (touchX === null) return;
      const dx = event.changedTouches[0].clientX - touchX;
      const dy = event.changedTouches[0].clientY - touchY;
      touchX = null;
      if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) turn(dx < 0 ? 1 : -1);
    });

    single.addEventListener('change', () => build(firstVisiblePage()));

    function openLightbox(image) {
      previousFocus = document.activeElement;
      lightboxImage.src = image.currentSrc || image.src;
      lightboxImage.alt = image.alt;
      lightbox.classList.add('open');
      document.body.style.overflow = 'hidden';
      lightboxClose.focus();
    }

    function closeLightbox() {
      lightbox.classList.remove('open');
      document.body.style.overflow = '';
      lightboxImage.src = '';
      if (previousFocus) previousFocus.focus();
    }

    lightboxClose.addEventListener('click', closeLightbox);
    lightbox.addEventListener('click', (event) => { if (event.target === lightbox) closeLightbox(); });
    document.addEventListener('keydown', (event) => { if (event.key === 'Escape' && lightbox.classList.contains('open')) closeLightbox(); });

    build(0);
  </script>
  <script src="/assets/menu.js" defer></script>
</body>
</html>
