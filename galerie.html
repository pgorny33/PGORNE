<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>P.GÓRNE — Galerie</title>
  <meta name="description" content="P.GÓRNE Galerie — a living editorial archive of craftsmanship, material, proportion, and garments in use." />
  <style>
    :root{
      --paper:#f3efe8;
      --ink:#141414;
      --accent:#6B3529;
      --page-pad:clamp(22px,4vw,64px);
      --section-space:clamp(150px,21vw,310px);
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth;background:var(--paper)}
    body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,Helvetica,sans-serif;-webkit-font-smoothing:antialiased}
    img{display:block;width:100%;height:100%;object-fit:cover}
    a{color:inherit;text-decoration:none}

    .site-header{
      position:relative;z-index:5;display:flex;justify-content:space-between;align-items:center;
      padding:26px var(--page-pad) 0;
    }
    .wordmark{font-size:14px;letter-spacing:.16em;font-weight:500}
    .return{font-size:10px;letter-spacing:.18em;text-transform:uppercase}
    .return:hover{color:var(--accent)}

    .opening{
      min-height:78vh;display:grid;place-items:center;text-align:center;padding:90px var(--page-pad) 120px;
    }
    .opening p{max-width:560px;margin:0;font-size:12px;line-height:1.95;letter-spacing:.065em}

    .chapter{padding:0 var(--page-pad) var(--section-space)}
    .chapter-title{
      margin:0 0 clamp(95px,14vw,190px);text-align:center;font-size:clamp(34px,5.8vw,76px);
      line-height:1;letter-spacing:.055em;font-weight:300;
    }
    .essay{max-width:1440px;margin:0 auto}
    .row{display:grid;align-items:start;margin-bottom:clamp(90px,14vw,220px)}
    figure{margin:0}
    .frame{overflow:hidden;background:#e8e1d7;cursor:zoom-in}
    .frame img{transition:transform 500ms ease,filter 500ms ease}
    .frame:hover img{transform:scale(1.012);filter:brightness(1.025)}

    /* Evening */
    .evening .r1{grid-template-columns:1fr minmax(280px,42vw) 1fr}
    .evening .r1 .frame{grid-column:2;aspect-ratio:3/4}
    .evening .r2{grid-template-columns:minmax(180px,26vw) 1fr minmax(220px,34vw);gap:clamp(36px,7vw,120px)}
    .evening .r2 .detail{grid-column:1;aspect-ratio:3/4;margin-top:18vw}
    .evening .r2 .prep{grid-column:3;aspect-ratio:3/4}
    .evening .r3{grid-template-columns:minmax(260px,38vw) 1fr}
    .evening .r3 .portrait{grid-column:1;aspect-ratio:3/4}
    .evening .r4{grid-template-columns:1fr minmax(320px,56vw)}
    .evening .r4 .vault{grid-column:2;aspect-ratio:4/3}
    .evening .r4 .vault img{object-position:center 63%}
    .evening .r5{grid-template-columns:minmax(260px,38vw) 1fr minmax(180px,26vw);gap:clamp(34px,7vw,120px)}
    .evening .r5 .stairs{grid-column:1;aspect-ratio:3/4}
    .evening .r5 .quiet{grid-column:3;aspect-ratio:3/4;margin-top:19vw}
    .evening .r6{grid-template-columns:1fr minmax(320px,50vw) 1fr}
    .evening .r6 .entry{grid-column:2;aspect-ratio:3/4}
    .evening .r7{grid-template-columns:minmax(260px,40vw) 1fr}
    .evening .r7 .departure{grid-column:1;aspect-ratio:3/4}

    /* Atelier */
    .atelier .a1{grid-template-columns:1fr minmax(380px,64vw) 1fr}
    .atelier .a1 .fitting{grid-column:2;aspect-ratio:7/6}
    .atelier .a2{grid-template-columns:minmax(210px,29vw) 1fr minmax(190px,25vw);gap:clamp(45px,9vw,150px)}
    .atelier .a2 .buttonhole{grid-column:1;aspect-ratio:1/1;margin-top:15vw}
    .atelier .a2 .threads{grid-column:3;aspect-ratio:3/4}
    .atelier .a2 .buttonhole img{object-position:center 52%}

    /* Wardrobe */
    .wardrobe .w1{grid-template-columns:minmax(290px,43vw) 1fr}
    .wardrobe .w1 .coat{grid-column:1;aspect-ratio:3/4}
    .wardrobe .w2{grid-template-columns:1fr minmax(260px,36vw)}
    .wardrobe .w2 .polo{grid-column:2;aspect-ratio:3/4}
    .wardrobe .w3{grid-template-columns:minmax(310px,51vw) 1fr}
    .wardrobe .w3 .set{grid-column:1;aspect-ratio:3/4}
    .wardrobe .w4{grid-template-columns:1fr minmax(220px,31vw) 1fr minmax(250px,36vw);gap:clamp(36px,6vw,100px)}
    .wardrobe .w4 .folded{grid-column:2;aspect-ratio:3/4;margin-top:13vw}
    .wardrobe .w4 .trousers{grid-column:4;aspect-ratio:3/4}

    /* Materials */
    .materials .m1{grid-template-columns:minmax(190px,27vw) 1fr minmax(230px,32vw);gap:clamp(45px,8vw,140px)}
    .materials .m1 .cable{grid-column:1;aspect-ratio:3/4;margin-top:17vw}
    .materials .m1 .rib{grid-column:3;aspect-ratio:3/4}
    .materials .m2{grid-template-columns:1fr minmax(230px,33vw) 1fr}
    .materials .m2 .coatdetail{grid-column:2;aspect-ratio:3/4}

    .archive-close{text-align:center;padding:10px 0 40px}
    .archive-close h2{margin:0 0 14px;font-size:clamp(24px,3vw,42px);font-weight:300;letter-spacing:.05em}
    .archive-close p{margin:0;font-size:10px;letter-spacing:.2em;text-transform:uppercase}
    .back-top{display:block;margin-top:90px;font-size:10px;letter-spacing:.18em;text-transform:uppercase}
    .back-top:hover{color:var(--accent)}

    .reveal{opacity:0;transform:translateY(18px);transition:opacity 750ms ease,transform 750ms ease}
    .reveal.visible{opacity:1;transform:none}

    .lightbox{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:clamp(16px,4vw,56px);background:rgba(243,239,232,.99);opacity:0;pointer-events:none;transition:opacity 220ms ease}
    .lightbox.open{opacity:1;pointer-events:auto}
    .lightbox img{width:auto;height:auto;max-width:92vw;max-height:88vh;object-fit:contain}
    .lightbox-close{position:absolute;top:24px;right:var(--page-pad);border:0;background:transparent;color:var(--ink);font:inherit;font-size:10px;letter-spacing:.18em;text-transform:uppercase;cursor:pointer}
    .lightbox-close:hover{color:var(--accent)}

    @media (max-width:760px){
      .site-header{padding-top:20px}
      .opening{min-height:62vh;padding-top:60px;padding-bottom:80px}
      .opening p{font-size:11px;max-width:390px}
      .chapter{padding-bottom:135px}
      .chapter-title{margin-bottom:95px}
      .row{display:block;margin-bottom:92px}
      .frame{width:100%;max-width:none;margin:0!important;aspect-ratio:auto!important}
      .frame img{height:auto;object-fit:contain}
      .evening .r2 .detail,.evening .r5 .quiet,.atelier .a2 .buttonhole,.materials .m1 .cable{width:68%;margin-bottom:92px!important}
      .evening .r2 .prep,.wardrobe .w2 .polo,.materials .m1 .rib{width:82%;margin-left:auto!important}
      .evening .r3 .portrait,.evening .r7 .departure,.wardrobe .w1 .coat{width:86%}
      .evening .r5 .stairs,.wardrobe .w3 .set{width:82%}
      .evening .r6 .entry,.atelier .a2 .threads{width:88%;margin-left:auto!important}
      .wardrobe .w4 .folded{width:68%;margin-bottom:92px!important}
      .wardrobe .w4 .trousers{width:84%;margin-left:auto!important}
      .materials .m2 .coatdetail{width:78%;margin:auto!important}
      .archive-close{padding-top:20px}
    }

    @media (prefers-reduced-motion:reduce){
      html{scroll-behavior:auto}
      .lightbox,.frame img,.reveal{transition:none}
      .reveal{opacity:1;transform:none}
    }
  </style>
</head>
<body>
  <header class="site-header">
    <a class="wordmark" href="index.html" aria-label="P.GÓRNE home">P.GÓRNE</a>
    <a class="return" href="index.html">Return</a>
  </header>

  <main id="top">
    <section class="opening">
      <p>A visual archive of craftsmanship, proportion, material, and the environments in which garments are worn.</p>
    </section>

    <section class="chapter evening" aria-labelledby="evening-title">
      <h1 class="chapter-title" id="evening-title">Evening</h1>
      <div class="essay">
        <div class="row r1"><figure class="frame reveal"><img src="assets/images/galerie/evening/01-tuxedo-hanger.jpg" alt="Double-breasted tuxedo hanging before an evening event" loading="eager"></figure></div>
        <div class="row r2"><figure class="frame detail reveal"><img src="assets/images/galerie/evening/02-lining-detail.jpg" alt="Personal embroidery inside a bespoke tuxedo" loading="lazy"></figure><figure class="frame prep reveal"><img src="assets/images/galerie/evening/03-bowtie-preparation.jpg" alt="Hands adjusting a bow tie" loading="lazy"></figure></div>
        <div class="row r3"><figure class="frame portrait reveal"><img src="assets/images/galerie/evening/04-tuxedo-portrait.jpg" alt="Portrait showing the tuxedo's lapels and silhouette" loading="lazy"></figure></div>
        <div class="row r4"><figure class="frame vault reveal"><img src="assets/images/galerie/evening/05-vault-exit.jpg" alt="Tuxedo in motion against a historic vault doorway" loading="lazy"></figure></div>
        <div class="row r5"><figure class="frame stairs reveal"><img src="assets/images/galerie/evening/06-staircase.jpg" alt="Evening tailoring descending a marble staircase" loading="lazy"></figure><figure class="frame quiet reveal"><img src="assets/images/galerie/evening/08-preparation.jpg" alt="Quiet preparation before an evening occasion" loading="lazy"></figure></div>
        <div class="row r6"><figure class="frame entry reveal"><img src="assets/images/galerie/evening/07-reception-entry.jpg" alt="Entering an evening reception in a bespoke tuxedo" loading="lazy"></figure></div>
        <div class="row r7"><figure class="frame departure reveal"><img src="assets/images/galerie/evening/09-departure.jpg" alt="Tuxedo silhouette moving through an evening reception" loading="lazy"></figure></div>
      </div>
    </section>

    <section class="chapter atelier" aria-labelledby="atelier-title">
      <h2 class="chapter-title" id="atelier-title">Atelier</h2>
      <div class="essay">
        <div class="row a1"><figure class="frame fitting reveal"><img src="assets/images/galerie/atelier/01-fitting.png" alt="A bespoke trouser fitting in progress" loading="lazy"></figure></div>
        <div class="row a2"><figure class="frame buttonhole reveal"><img src="assets/images/galerie/atelier/02-buttonhole.png" alt="Hand-finished buttonhole and tailoring detail" loading="lazy"></figure><figure class="frame threads reveal"><img src="assets/images/galerie/atelier/03-thread-selection.jpg" alt="Thread colors selected against denim" loading="lazy"></figure></div>
      </div>
    </section>

    <section class="chapter wardrobe" aria-labelledby="wardrobe-title">
      <h2 class="chapter-title" id="wardrobe-title">Wardrobe</h2>
      <div class="essay">
        <div class="row w1"><figure class="frame coat reveal"><img src="assets/images/galerie/wardrobe/01-sport-coat.jpg" alt="Brown tailored sport coat styled with a striped shirt" loading="lazy"></figure></div>
        <div class="row w2"><figure class="frame polo reveal"><img src="assets/images/galerie/wardrobe/02-knit-polo.jpg" alt="Light blue knit polo displayed in the atelier" loading="lazy"></figure></div>
        <div class="row w3"><figure class="frame set reveal"><img src="assets/images/galerie/wardrobe/03-overshirt-trouser.jpg" alt="Brown overshirt and drawstring trouser ensemble" loading="lazy"></figure></div>
        <div class="row w4"><figure class="frame folded reveal"><img src="assets/images/galerie/wardrobe/04-folded-overshirt.jpg" alt="Plaid overshirt folded inside a presentation box" loading="lazy"></figure><figure class="frame trousers reveal"><img src="assets/images/galerie/wardrobe/05-trouser-lineup.jpg" alt="A coordinated lineup of tailored trousers" loading="lazy"></figure></div>
      </div>
    </section>

    <section class="chapter materials" aria-labelledby="materials-title">
      <h2 class="chapter-title" id="materials-title">Materials</h2>
      <div class="essay">
        <div class="row m1"><figure class="frame cable reveal"><img src="assets/images/galerie/materials/01-cable-knit.jpg" alt="Close view of cable-knit texture and horn buttons" loading="lazy"></figure><figure class="frame rib reveal"><img src="assets/images/galerie/materials/02-ribbed-knit.jpg" alt="Ribbed knit texture and metal zip detail" loading="lazy"></figure></div>
        <div class="row m2"><figure class="frame coatdetail reveal"><img src="assets/images/galerie/materials/03-coat-detail.jpg" alt="Wool coat texture and horn button detail" loading="lazy"></figure></div>
      </div>
    </section>

    <footer class="archive-close">
      <h2>The Archive</h2>
      <p>New York · 2019—Present</p>
      <a class="back-top" href="#top">Back to top</a>
    </footer>
  </main>

  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Expanded Galerie image">
    <button class="lightbox-close" id="lightboxClose" type="button">Close</button>
    <img id="lightboxImage" src="" alt="">
  </div>

  <script>
    const lightbox = document.getElementById('lightbox');
    const lightboxImage = document.getElementById('lightboxImage');
    const closeButton = document.getElementById('lightboxClose');
    let previousFocus = null;

    document.querySelectorAll('.frame img').forEach((image) => {
      const frame = image.parentElement;
      frame.setAttribute('tabindex', '0');
      frame.setAttribute('role', 'button');
      frame.setAttribute('aria-label', `Expand image: ${image.alt}`);
      const open = () => {
        previousFocus = document.activeElement;
        lightboxImage.src = image.src;
        lightboxImage.alt = image.alt;
        lightbox.classList.add('open');
        document.body.style.overflow = 'hidden';
        closeButton.focus();
      };
      frame.addEventListener('click', open);
      frame.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); open(); }
      });
    });

    const close = () => {
      lightbox.classList.remove('open');
      document.body.style.overflow = '';
      lightboxImage.src = '';
      if (previousFocus) previousFocus.focus();
    };
    closeButton.addEventListener('click', close);
    lightbox.addEventListener('click', (event) => { if (event.target === lightbox) close(); });
    document.addEventListener('keydown', (event) => { if (event.key === 'Escape' && lightbox.classList.contains('open')) close(); });

    const reveals = document.querySelectorAll('.reveal');
    if ('IntersectionObserver' in window && !window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      const observer = new IntersectionObserver((entries) => {
        entries.forEach((entry) => {
          if (entry.isIntersecting) { entry.target.classList.add('visible'); observer.unobserve(entry.target); }
        });
      }, { threshold: 0.08, rootMargin: '0px 0px -4% 0px' });
      reveals.forEach((item) => observer.observe(item));
    } else {
      reveals.forEach((item) => item.classList.add('visible'));
    }
  </script>
</body>
</html>
