<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>P.GÓRNE — Ready Made</title>
  <meta name="description" content="Limited-edition ready-to-wear garments from the P.GÓRNE atelier in New York City." />
  <link rel="icon" type="image/png" href="/assets/accent-pantone.png" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="P.GÓRNE" />
  <meta property="og:title" content="P.GÓRNE — Ready Made" />
  <meta property="og:description" content="Limited-edition ready-to-wear garments from the P.GÓRNE atelier in New York City." />
  <meta property="og:url" content="https://www.pgorne.com/ready-made" />
  <meta property="og:image" content="https://www.pgorne.com/assets/poster.jpg" />
  <meta property="og:image:width" content="1616" />
  <meta property="og:image:height" content="1080" />
  <meta name="twitter:card" content="summary_large_image" />
  <style>
    :root{--paper:#f3efe8;--ink:#141414;--accent:#6B3529;}
    html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:Arial, Helvetica, sans-serif;}
    main{min-height:100vh;display:grid;place-items:center;text-align:center;padding:40px;}
    h1{font-size:clamp(36px,7vw,96px);font-weight:300;letter-spacing:.08em;text-transform:uppercase;margin:0 0 22px;}
    p{max-width:680px;font-size:14px;line-height:1.65;letter-spacing:.04em;text-align:center;margin:0 auto 58px;}
    .visually-hidden{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    .description{margin-bottom:20px}
    .newsletter-intro{max-width:560px;font-size:10px;line-height:1.6;letter-spacing:.22em;text-transform:uppercase;margin:0 auto 12px}
    .newsletter{position:relative;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;column-gap:18px;row-gap:4px;max-width:min(100%,430px);margin:0 auto 30px;color:var(--ink);font-family:Arial,Helvetica,sans-serif;touch-action:manipulation;user-select:text;-webkit-user-select:text}
    .newsletter-field{display:block;flex:0 1 320px;max-width:100%}
    .newsletter input[type="email"]{display:block;width:min(320px,100%);padding:8px 0;border:0;border-bottom:1px solid var(--ink);border-radius:0;background:transparent;color:var(--ink);font:12px Arial,Helvetica,sans-serif;letter-spacing:.08em}
    .newsletter input[type="email"]::placeholder{color:var(--ink);opacity:.65}
    .newsletter input[type="email"]:focus-visible{outline:1px solid var(--accent);outline-offset:4px}
    .newsletter button{appearance:none;border:0;background:transparent;color:var(--ink);padding:8px 0;font:10px Arial,Helvetica,sans-serif;letter-spacing:.18em;text-transform:uppercase;white-space:nowrap;cursor:pointer}
    .newsletter button:hover{color:var(--accent)}
    .newsletter button:focus-visible{outline:1px solid var(--accent);outline-offset:4px}
    .newsletter button:disabled{opacity:.5;cursor:wait}
    .newsletter-status{flex:0 0 100%;max-width:none;min-height:1.4em;margin:0;font-size:11px;line-height:1.4;letter-spacing:.04em}
    .newsletter.is-done .newsletter-field,.newsletter.is-done button{display:none}
    a{color:var(--ink);text-decoration:none;text-transform:uppercase;letter-spacing:.16em;font-size:12px;}
    a:hover{color:var(--accent);}
  </style>
</head>
<body>
  <main>
    <div>
      <h1>Ready Made</h1>
      <p class="description">A curated extension of the atelier. Ready-to-wear garments are produced in limited editions.</p>
      <p class="newsletter-intro">Subscribe for new work and early access to future releases.</p>
      <form class="newsletter" data-kit-form="" novalidate>
        <label class="newsletter-field"><span class="visually-hidden">Email address</span><input type="email" name="email_address" placeholder="Email address" autocomplete="email" required></label>
        <span class="visually-hidden" aria-hidden="true"><input type="text" name="website" tabindex="-1" autocomplete="off"></span>
        <button type="submit">Subscribe</button>
        <p class="newsletter-status" role="status" aria-live="polite"></p>
      </form>
      <a class="menu-toggle" href="/">Menu</a>
    </div>
  </main>
  <script src="/assets/newsletter.js" defer></script>
  <script src="/assets/menu.js" defer></script>
</body>
</html>
